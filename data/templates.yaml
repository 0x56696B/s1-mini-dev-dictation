# Dictation templates for the S1-mini dictation fine-tune.
# Slots: {term} (any category) or {term:<category>} (categories as in vocab.yaml).
# Fill rule: raw receives a lowercase `spoken` variant, clean receives the matching `written` form.
# Each category appears at most once per template and {term} at most once, so every slot is an independent fill.
# control : optional. Default is [Styling: semi-formal] [Structure: prose] [Context: general].
# reviewed: true only where the clean form is correct for every possible fill of every slot.
# Rows without `clean` are labeled by the teacher model later.
# general : everyday non-technical raw transcripts (anti-forgetting). Labeled later.
templates:
